    <script>
        // Web Audio API Synthesizer (No external audio files needed!)
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        // Pre-generate Noise Buffer for air/wet sound effects
        let noiseBuffer = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
                
                // Create 2 seconds of white noise
                const bufferSize = audioCtx.sampleRate * 2;
                noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Procedural Fart Synthesizer
        function synthesizeFart() {
            initAudio();
            const now = audioCtx.currentTime;

            // Pick a random fart profile (0 to 5)
            const type = Math.floor(Math.random() * 6);

            // Create Audio Nodes
            const osc = audioCtx.createOscillator();
            const oscGain = audioCtx.createGain();

            const lfo = audioCtx.createOscillator();
            const lfoGain = audioCtx.createGain();

            const noise = audioCtx.createBufferSource();
            noise.buffer = noiseBuffer;
            const noiseFilter = audioCtx.createBiquadFilter();
            const noiseGain = audioCtx.createGain();

            const masterFilter = audioCtx.createBiquadFilter();
            const masterGain = audioCtx.createGain();

            let duration = 0.5;
            let label = "PFFFFT!";

            // Connect LFO (Vibrato/Flutter for lip flapping effect)
            lfo.connect(lfoGain);

            // Sound Profiles
            switch(type) {
                case 0: // Wet Squelch
                    label = "SQUELCH!";
                    duration = 0.5 + Math.random() * 0.3;
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(110, now);
                    osc.frequency.exponentialRampToValueAtTime(30, now + duration);

                    lfo.frequency.setValueAtTime(22, now);
                    lfoGain.gain.setValueAtTime(40, now);
                    lfo.connect(osc.frequency);

                    noiseFilter.type = 'bandpass';
                    noiseFilter.frequency.setValueAtTime(800, now);
                    noiseGain.gain.setValueAtTime(0.4, now);
                    noiseGain.gain.exponentialRampToValueAtTime(0.01, now + duration);

                    masterFilter.type = 'lowpass';
                    masterFilter.frequency.setValueAtTime(1000, now);
                    break;

                case 1: // High Squeaker
                    label = "SQUEEEEK!";
                    duration = 0.3 + Math.random() * 0.2;
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(70, now + duration);

                    lfo.frequency.setValueAtTime(35, now);
                    lfoGain.gain.setValueAtTime(20, now);
                    lfo.connect(osc.frequency);

                    noiseGain.gain.setValueAtTime(0.05, now);

                    masterFilter.type = 'lowpass';
                    masterFilter.frequency.setValueAtTime(1800, now);
                    break;

                case 2: // The Monster Rip
                    label = "BRAAAT!!";
                    duration = 0.8 + Math.random() * 0.4;
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(130, now);
                    osc.frequency.linearRampToValueAtTime(45, now + duration);

                    lfo.type = 'sawtooth';
                    lfo.frequency.setValueAtTime(16, now);
                    lfoGain.gain.setValueAtTime(0.5, now);
                    lfo.connect(masterGain.gain); // Tremolo effect

                    noiseFilter.type = 'lowpass';
                    noiseFilter.frequency.setValueAtTime(500, now);
                    noiseGain.gain.setValueAtTime(0.3, now);

                    masterFilter.type = 'lowpass';
                    masterFilter.frequency.setValueAtTime(1400, now);
                    break;

                case 3: // Bubble Burst / Wet Pop
                    label = "PLOP-SPLRT!";
                    duration = 0.4 + Math.random() * 0.2;
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.setValueAtTime(60, now + 0.08);
                    osc.frequency.exponentialRampToValueAtTime(25, now + duration);

                    lfo.frequency.setValueAtTime(30, now);
                    lfoGain.gain.setValueAtTime(50, now);
                    lfo.connect(osc.frequency);

                    noiseGain.gain.setValueAtTime(0.3, now);

                    masterFilter.type = 'bandpass';
                    masterFilter.frequency.setValueAtTime(600, now);
                    break;

                case 4: // Deep Rumble
                    label = "GRUUUUMBLE...";
                    duration = 1.1 + Math.random() * 0.5;
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(65, now);
                    osc.frequency.linearRampToValueAtTime(25, now + duration);

                    lfo.frequency.setValueAtTime(12, now);
                    lfoGain.gain.setValueAtTime(25, now);
                    lfo.connect(osc.frequency);

                    noiseFilter.type = 'lowpass';
                    noiseFilter.frequency.setValueAtTime(250, now);
                    noiseGain.gain.setValueAtTime(0.25, now);

                    masterFilter.type = 'lowpass';
                    masterFilter.frequency.setValueAtTime(450, now);
                    break;

                case 5: // Wet Slime Burst
                    label = "SPLURRRTT!";
                    duration = 0.6 + Math.random() * 0.3;
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(35, now + duration);

                    lfo.frequency.setValueAtTime(28, now);
                    lfoGain.gain.setValueAtTime(60, now);
                    lfo.connect(osc.frequency);

                    noiseFilter.type = 'highpass';
                    noiseFilter.frequency.setValueAtTime(500, now);
                    noiseGain.gain.setValueAtTime(0.5, now);

                    masterFilter.type = 'lowpass';
                    masterFilter.frequency.setValueAtTime(1200, now);
                    break;
            }

            // Envelope Setup
            masterGain.gain.setValueAtTime(0.01, now);
            masterGain.gain.linearRampToValueAtTime(0.8, now + 0.03);
            masterGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

            // Connect Nodes
            osc.connect(oscGain);
            oscGain.connect(masterFilter);

            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(masterFilter);

            masterFilter.connect(masterGain);
            masterGain.connect(audioCtx.destination);

            // Play
            osc.start(now);
            lfo.start(now);
            noise.start(now);

            osc.stop(now + duration);
            lfo.stop(now + duration);
            noise.stop(now + duration);

            return label;
        }

        // Game State Variables
        let fartCount = 0;
        let stinkLevel = 0;

        const jar = document.getElementById('goo-jar');
        const stage = document.getElementById('stage');
        const fartCountEl = document.getElementById('fart-count');
        const meterFillEl = document.getElementById('meter-fill');
        const stinkStatusEl = document.getElementById('stink-status');

        // Status Titles
        const statusLevels = [
            { min: 0, text: "FRESH", color: "#86efac" },
            { min: 5, text: "SMELLY", color: "#facc15" },
            { min: 15, text: "FUNKY", color: "#f97316" },
            { min: 30, text: "TOXIC ☣", color: "#ef4444" },
            { min: 50, text: "BIOHAZARD!", color: "#a855f7" },
            { min: 75, text: "NUCLEAR STINK!!", color: "#39ff14" }
        ];

        // Jar Press Event Handler
        function pressJar(e) {
            e.preventDefault();

            // Visual Squish Effect
            jar.classList.remove('squish');
            void jar.offsetWidth; // Trigger reflow
            jar.classList.add('squish');

            // Play Sound & Get Text
            const soundText = synthesizeFart();

            // Get click/touch location for particles
            const rect = jar.getBoundingClientRect();
            const clickX = (e.clientX || (e.touches && e.touches[0].clientX) || (rect.left + rect.width / 2)) - rect.left;
            const clickY = (e.clientY || (e.touches && e.touches[0].clientY) || (rect.top + rect.height / 2)) - rect.top;

            // Spawn Visual Effects
            spawnSoundText(soundText, rect.left + clickX, rect.top + clickY);
            spawnGooSplatter(rect.left + clickX, rect.top + clickY);
            spawnStinkLine();

            // Update Game State
            fartCount++;
            stinkLevel = Math.min(stinkLevel + 4, 100);
            
            updateUI();
        }

        // Spawn Floating Text Effect
        function spawnSoundText(text, x, y) {
            const el = document.createElement('div');
            el.className = 'sound-popup';
            el.innerText = text;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            document.body.appendChild(el);

            setTimeout(() => el.remove(), 900);
        }

        // Spawn Goo Splash Particles
        function spawnGooSplatter(originX, originY) {
            const count = 10;
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';

                const size = Math.random() * 8 + 6;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = originX + 'px';
                particle.style.top = originY + 'px';

                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 80 + 40;
                const vx = Math.cos(angle) * speed;
                const vy = Math.sin(angle) * speed;

                document.body.appendChild(particle);

                particle.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${vx}px, ${vy + 50}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 600 + Math.random() * 300,
                    easing: 'cubic-bezier(0.25, 0.46, 0.45, 0.94)'
                }).onfinish = () => particle.remove();
            }
        }

        // Spawn Wavy SVG Stink Lines
        function spawnStinkLine() {
            const svgNS = "http://www.w3.org/2000/svg";
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("class", "stink-line");
            svg.setAttribute("viewBox", "0 0 40 80");
            svg.style.width = "40px";
            svg.style.height = "80px";

            // Random offset relative to jar
            const randomX = (Math.random() - 0.5) * 100;
            svg.style.left = `calc(50% + ${randomX}px)`;
            svg.style.top = "20px";

            const path = document.createElementNS(svgNS, "path");
            path.setAttribute("d", "M 20 80 Q 35 60 20 40 T 20 0");
            svg.appendChild(path);

            stage.appendChild(svg);
            setTimeout(() => svg.remove(), 2000);
        }

        // Update Stink Meter and UI
        function updateUI() {
            fartCountEl.innerText = fartCount;
            meterFillEl.style.width = stinkLevel + '%';

            // Find matching stink status
            let currentStatus = statusLevels[0];
            for (let i = statusLevels.length - 1; i >= 0; i--) {
                if (fartCount >= statusLevels[i].min) {
                    currentStatus = statusLevels[i];
                    break;
                }
            }

            stinkStatusEl.innerText = currentStatus.text;
            stinkStatusEl.style.color = currentStatus.color;
        }

        // Stink Decay over time
        setInterval(() => {
            if (stinkLevel > 0) {
                stinkLevel = Math.max(0, stinkLevel - 1);
                meterFillEl.style.width = stinkLevel + '%';
            }
        }, 300);

        // Event Listeners
        jar.addEventListener('mousedown', pressJar);
        jar.addEventListener('touchstart', pressJar, { passive: false });
    </script>
</body>
</html>
