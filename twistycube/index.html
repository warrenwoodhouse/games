<html>
<head>
  <meta charset="UTF-8">
  <title>Twisty Cube - GotGames Interactive - Warren Woodhouse</title>
  
  <!-- 1. Load the cubing.js twisty player module -->
  <script type="module" src="https://cdn.cubing.net/v0/js/cubing/twisty"></script>
  
  <style>
    /* 2. Set the size of your cube container */
    .cube-container {
      width: 400px; 
      height: 400px;
      margin: 50px auto;
    }
  </style>
</head>
<body>
    <h1>Twisty Cube</h1>
    <h2>Game by Warren Woodhouse. Original code &copy;2026 <a href="https://warrenwoodhouse.blogspot.com/">Warren Woodhouse</a>. Built using: Cubing API. Rubik’s Cube is a registered trademark of The Rubik’s Company.</h2>
    <h3>A fun interactive minigame that features the Rubik’s Cube.</h3>

  <div class="cube-container">
    <!-- 3. Add the cube to your page -->
    <twisty-player 
      puzzle="3x3x3" 
      alg="R U R' U R U2 R'" 
      background="none">
    </twisty-player>
  </div>

</body>
</html>
