<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pong Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 10px;
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            font-size: 2.5em;
            margin-bottom: 4px;
        }

        .panel {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            padding: 10px 12px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.2);
        }

        .difficulty-btn,
        .match-btn,
        .reset-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.35);
            color: white;
            padding: 10px 16px;
            border-radius: 999px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95em;
            transition: all 0.2s ease;
            min-width: 90px;
        }

        .difficulty-btn.active,
        .match-btn.active {
            background: #ffff00;
            color: #111;
            border-color: #ffff00;
            box-shadow: 0 0 12px rgba(255, 255, 0, 0.6);
        }

        .reset-btn {
            background: rgba(255, 255, 255, 0.22);
            min-width: 120px;
        }

        .difficulty-btn:hover,
        .match-btn:hover,
        .reset-btn:hover {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, 0.25);
        }

        .status {
            color: white;
            font-size: 0.9em;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 999px;
            padding: 8px 14px;
            min-width: 220px;
            text-align: center;
        }

        #gameCanvas {
            border: 3px solid white;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            cursor: none;
            touch-action: none;
            display: block;
            max-width: 100%;
            height: auto;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            width: 400px;
            color: white;
            font-size: 1.5em;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .score-section {
            flex: 1;
        }

        .score-label {
            font-size: 0.8em;
            color: #aaa;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 2em;
            font-weight: bold;
            color: #ffff00;
        }

        .instructions {
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 20px;
            border-radius: 8px;
            max-width: 500px;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .instructions p {
            margin-bottom: 8px;
        }

        .controls-list {
            text-align: left;
            display: inline-block;
            margin-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            padding-top: 10px;
        }

        .controls-list li {
            margin-bottom: 5px;
        }

        .mobile-controls {
            display: none;
            gap: 15px;
            justify-content: center;
            width: 100%;
            max-width: 400px;
        }

        .control-button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 15px 25px;
            font-size: 1.2em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            font-weight: bold;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .control-button:active {
            background: rgba(255, 255, 255, 0.4);
            border-color: rgba(255, 255, 255, 0.8);
            transform: scale(0.95);
        }

        .control-button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.7);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            #gameCanvas {
                width: 95vw;
                max-width: 600px;
                height: auto;
            }

            .scoreboard {
                width: 90vw;
                max-width: 300px;
                font-size: 1.2em;
            }

            .instructions {
                width: 90vw;
                max-width: 400px;
                font-size: 0.75em;
            }

            .mobile-controls {
                display: flex;
            }

            .container {
                gap: 10px;
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.5em;
            }

            .scoreboard {
                width: 85vw;
                padding: 10px;
            }

            .score-value {
                font-size: 1.5em;
            }

            .instructions {
                width: 85vw;
                font-size: 0.7em;
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏓 Pong</h1>

        <div class="panel" aria-label="Difficulty selector">
            <button class="difficulty-btn" data-difficulty="easy">Easy</button>
            <button class="difficulty-btn active" data-difficulty="medium">Medium</button>
            <button class="difficulty-btn" data-difficulty="hard">Hard</button>
        </div>

        <div class="panel" aria-label="Match length selector">
            <button class="match-btn" data-bestof="3">Best of 3</button>
            <button class="match-btn active" data-bestof="5">Best of 5</button>
            <button class="match-btn" data-bestof="7">Best of 7</button>
            <button class="reset-btn" id="resetButton">Reset Match</button>
        </div>

        <div class="status" id="statusText">Best of 5 • First to 3</div>
        
        <div class="scoreboard">
            <div class="score-section">
                <div class="score-label">Player</div>
                <div class="score-value" id="playerScore">0</div>
            </div>
            <div class="score-section">
                <div class="score-label">Computer</div>
                <div class="score-value" id="computerScore">0</div>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <div class="mobile-controls">
            <button class="control-button" id="upButton">⬆️ UP</button>
            <button class="control-button" id="downButton">⬇️ DOWN</button>
        </div>

        <div class="instructions">
            <p><strong>How to Play:</strong></p>
            <ul class="controls-list">
                <li>📱 <strong>Touch</strong> - Move paddle on mobile</li>
                <li>🖱️ <strong>Mouse</strong> - Move left paddle vertically</li>
                <li>⬆️⬇️ <strong>Arrow Keys</strong> - Move left paddle up/down</li>
                <li>🤖 Computer controls the right paddle</li>
            </ul>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('statusText');

        const paddleWidth = 10;
        const paddleHeight = 80;
        const ballSize = 8;
        const paddleSpeed = 6;

        const difficultySettings = {
            easy: {
                computerSpeed: 2.3,
                trackingDeadZone: 85,
                ballSpeed: 4.6,
                reaction: 0.18,
                intensity: 0.9
            },
            medium: {
                computerSpeed: 2.8,
                trackingDeadZone: 60,
                ballSpeed: 5.2,
                reaction: 0.12,
                intensity: 1.1
            },
            hard: {
                computerSpeed: 3.6,
                trackingDeadZone: 35,
                ballSpeed: 5.8,
                reaction: 0.08,
                intensity: 1.35
            }
        };

        const player = {
            x: 10,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            score: 0,
            speed: paddleSpeed
        };

        const computer = {
            x: canvas.width - paddleWidth - 10,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            score: 0,
            speed: difficultySettings.medium.computerSpeed,
            targetY: canvas.height / 2,
            smoothing: 0.12
        };

        let currentDifficulty = 'medium';
        let bestOf = 5;
        let matchTarget = 3;
        let keysPressed = {};
        let mouseY = canvas.height / 2;
        let touchY = canvas.height / 2;
        let mobileUpPressed = false;
        let mobileDownPressed = false;
        let isMobileDevice = window.innerWidth <= 768;

        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            dx: difficultySettings[currentDifficulty].ballSpeed,
            dy: difficultySettings[currentDifficulty].ballSpeed,
            size: ballSize,
            speed: difficultySettings[currentDifficulty].ballSpeed
        };

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function setMatchLength(value) {
            bestOf = Number(value);
            matchTarget = Math.ceil(bestOf / 2);
            statusText.textContent = `Best of ${bestOf} • First to ${matchTarget}`;
            resetScores();
        }

        function updateStatus(text) {
            statusText.textContent = text;
        }

        function applyDifficulty(level) {
            currentDifficulty = level;
            const settings = difficultySettings[level];
            computer.speed = settings.computerSpeed;
            computer.smoothing = settings.reaction;
            ball.speed = settings.ballSpeed;
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * ball.speed;
            ball.dy = (Math.random() * 2 - 1) * ball.speed;

            document.querySelectorAll('.difficulty-btn').forEach((button) => {
                button.classList.toggle('active', button.dataset.difficulty === level);
            });
        }

        function resetScores() {
            player.score = 0;
            computer.score = 0;
            updateScore();
            resetBall();
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * ball.speed;
            ball.dy = (Math.random() * 2 - 1) * ball.speed;
        }

        function updateScore() {
            document.getElementById('playerScore').textContent = player.score;
            document.getElementById('computerScore').textContent = computer.score;
        }

        function isMatchWinner() {
            return player.score >= matchTarget || computer.score >= matchTarget;
        }

        function handlePointScored(winner) {
            const label = winner === 'player' ? 'Player' : 'Computer';
            updateStatus(`Best of ${bestOf} • ${label} wins the point`);

            if (isMatchWinner()) {
                const winnerLabel = player.score >= matchTarget ? 'Player' : 'Computer';
                updateStatus(`Best of ${bestOf} • ${winnerLabel} wins the match!`);
                setTimeout(() => {
                    player.score = 0;
                    computer.score = 0;
                    updateScore();
                    resetBall();
                    updateStatus(`Best of ${bestOf} • First to ${matchTarget}`);
                }, 1200);
                return;
            }
        }

        function getComputerTargetY() {
            let targetY = ball.y;

            if (ball.dx > 0) {
                const distanceToComputer = computer.x - ball.x;
                const travelTime = distanceToComputer / Math.abs(ball.dx);
                let predictedY = ball.y + (ball.dy * travelTime);

                while (predictedY < 0 || predictedY > canvas.height) {
                    if (predictedY < 0) {
                        predictedY = Math.abs(predictedY);
                    } else if (predictedY > canvas.height) {
                        predictedY = canvas.height - (predictedY - canvas.height);
                    }
                }

                targetY = predictedY;
            }

            return clamp(targetY, paddleHeight / 2, canvas.height - paddleHeight / 2);
        }

        function updatePlayer() {
            if (isMobileDevice && touchY !== canvas.height / 2) {
                if (touchY < player.y + paddleHeight / 2) {
                    player.y -= player.speed;
                } else if (touchY > player.y + paddleHeight / 2) {
                    player.y += player.speed;
                }
            }

            if (mobileUpPressed) player.y -= player.speed;
            if (mobileDownPressed) player.y += player.speed;

            if (!isMobileDevice) {
                if (mouseY < player.y + paddleHeight / 2) {
                    player.y -= player.speed;
                } else if (mouseY > player.y + paddleHeight / 2) {
                    player.y += player.speed;
                }
            }

            if (keysPressed['ArrowUp']) player.y -= player.speed;
            if (keysPressed['ArrowDown']) player.y += player.speed;

            if (player.y < 0) player.y = 0;
            if (player.y + player.height > canvas.height) {
                player.y = canvas.height - player.height;
            }
        }

        function updateComputer() {
            const targetY = getComputerTargetY();
            const center = computer.y + computer.height / 2;
            const delta = targetY - center;
            const movement = clamp(delta * computer.smoothing, -computer.speed, computer.speed);
            computer.y += movement;

            if (computer.y < 0) computer.y = 0;
            if (computer.y + computer.height > canvas.height) {
                computer.y = canvas.height - computer.height;
            }
        }

        function updateBall() {
            ball.x += ball.dx;
            ball.y += ball.dy;

            if (ball.y - ball.size < 0 || ball.y + ball.size > canvas.height) {
                ball.dy = -ball.dy;
                ball.y = clamp(ball.y, ball.size, canvas.height - ball.size);
            }

            if (
                ball.x - ball.size < player.x + player.width &&
                ball.y > player.y &&
                ball.y < player.y + player.height
            ) {
                ball.dx = Math.abs(ball.dx);
                const collidePoint = (ball.y - (player.y + player.height / 2)) / (player.height / 2);
                ball.dy = collidePoint * ball.speed;
                ball.x = player.x + player.width + ball.size;
            }

            if (
                ball.x + ball.size > computer.x &&
                ball.y > computer.y &&
                ball.y < computer.y + computer.height
            ) {
                ball.dx = -Math.abs(ball.dx);
                const collidePoint = (ball.y - (computer.y + computer.height / 2)) / (computer.height / 2);
                ball.dy = collidePoint * ball.speed;
                ball.x = computer.x - ball.size;
            }

            if (ball.x < 0) {
                computer.score++;
                updateScore();
                handlePointScored('computer');
                resetBall();
            }

            if (ball.x > canvas.width) {
                player.score++;
                updateScore();
                handlePointScored('player');
                resetBall();
            }
        }

        function drawPaddle(paddle) {
            ctx.fillStyle = '#fff';
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
        }

        function drawBall() {
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.size, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawCenterLine() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function gameLoop() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawCenterLine();
            drawPaddle(player);
            drawPaddle(computer);
            drawBall();

            updatePlayer();
            updateComputer();
            updateBall();

            requestAnimationFrame(gameLoop);
        }

        document.querySelectorAll('.difficulty-btn').forEach((button) => {
            button.addEventListener('click', () => {
                applyDifficulty(button.dataset.difficulty);
            });
        });

        document.querySelectorAll('.match-btn').forEach((button) => {
            button.addEventListener('click', () => {
                document.querySelectorAll('.match-btn').forEach((btn) => {
                    btn.classList.toggle('active', btn === button);
                });
                setMatchLength(button.dataset.bestof);
            });
        });

        document.getElementById('resetButton').addEventListener('click', () => {
            resetScores();
            updateStatus(`Best of ${bestOf} • First to ${matchTarget}`);
        });

        window.addEventListener('keydown', (event) => {
            keysPressed[event.key] = true;
        });

        window.addEventListener('keyup', (event) => {
            keysPressed[event.key] = false;
        });

        document.addEventListener('mousemove', (event) => {
            const rect = canvas.getBoundingClientRect();
            mouseY = event.clientY - rect.top;
        });

        document.addEventListener('touchmove', (event) => {
            event.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = event.touches[0];
            touchY = touch.clientY - rect.top;
        }, { passive: false });

        document.addEventListener('touchend', () => {
            touchY = canvas.height / 2;
        });

        const upButton = document.getElementById('upButton');
        const downButton = document.getElementById('downButton');

        if (upButton) {
            upButton.addEventListener('touchstart', (e) => {
                e.preventDefault();
                mobileUpPressed = true;
            });
            upButton.addEventListener('touchend', (e) => {
                e.preventDefault();
                mobileUpPressed = false;
            });
            upButton.addEventListener('mousedown', () => {
                mobileUpPressed = true;
            });
            upButton.addEventListener('mouseup', () => {
                mobileUpPressed = false;
            });
        }

        if (downButton) {
            downButton.addEventListener('touchstart', (e) => {
                e.preventDefault();
                mobileDownPressed = true;
            });
            downButton.addEventListener('touchend', (e) => {
                e.preventDefault();
                mobileDownPressed = false;
            });
            downButton.addEventListener('mousedown', () => {
                mobileDownPressed = true;
            });
            downButton.addEventListener('mouseup', () => {
                mobileDownPressed = false;
            });
        }

        window.addEventListener('resize', () => {
            isMobileDevice = window.innerWidth <= 768;
        });

        applyDifficulty(currentDifficulty);
        setMatchLength(bestOf);
        updateScore();
        gameLoop();
    </script>
</body>
</html>
