<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pong Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            padding: 10px;
        }

        h1 {
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            font-size: 2.5em;
            margin-bottom: 5px;
        }

        .difficulty-panel {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.2);
        }

        .difficulty-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.35);
            color: white;
            padding: 10px 18px;
            border-radius: 999px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95em;
            transition: all 0.2s ease;
            min-width: 90px;
        }

        .difficulty-btn.active {
            background: #ffff00;
            color: #111;
            border-color: #ffff00;
            box-shadow: 0 0 12px rgba(255, 255, 0, 0.6);
        }

        .difficulty-btn:hover {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, 0.25);
        }

        #gameCanvas {
            border: 3px solid white;
            background-color: #000;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            cursor: none;
            touch-action: none;
            display: block;
            max-width: 100%;
            height: auto;
        }

        .scoreboard {
            display: flex;
            justify-content: space-around;
            width: 400px;
            color: white;
            font-size: 1.5em;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .score-section {
            flex: 1;
        }

        .score-label {
            font-size: 0.8em;
            color: #aaa;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 2em;
            font-weight: bold;
            color: #ffff00;
        }

        .instructions {
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 20px;
            border-radius: 8px;
            max-width: 500px;
            font-size: 0.9em;
            line-height: 1.6;
        }

        .instructions p {
            margin-bottom: 8px;
        }

        .controls-list {
            text-align: left;
            display: inline-block;
            margin-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            padding-top: 10px;
        }

        .controls-list li {
            margin-bottom: 5px;
        }

        .mobile-controls {
            display: none;
            gap: 15px;
            justify-content: center;
            width: 100%;
            max-width: 400px;
        }

        .control-button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 15px 25px;
            font-size: 1.2em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            flex: 1;
            font-weight: bold;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .control-button:active {
            background: rgba(255, 255, 255, 0.4);
            border-color: rgba(255, 255, 255, 0.8);
            transform: scale(0.95);
        }

        .control-button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.7);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
                margin-bottom: 5px;
            }

            #gameCanvas {
                width: 95vw;
                max-width: 600px;
                height: auto;
            }

            .scoreboard {
                width: 90vw;
                max-width: 300px;
                font-size: 1.2em;
            }

            .instructions {
                width: 90vw;
                max-width: 400px;
                font-size: 0.75em;
            }

            .mobile-controls {
                display: flex;
            }

            .container {
                gap: 10px;
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.5em;
            }

            .scoreboard {
                width: 85vw;
                padding: 10px;
            }

            .score-value {
                font-size: 1.5em;
            }

            .instructions {
                width: 85vw;
                font-size: 0.7em;
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏓 Pong</h1>

        <div class="difficulty-panel" aria-label="Difficulty selector">
            <button class="difficulty-btn" data-difficulty="easy">Easy</button>
            <button class="difficulty-btn active" data-difficulty="medium">Medium</button>
            <button class="difficulty-btn" data-difficulty="hard">Hard</button>
        </div>
        
        <div class="scoreboard">
            <div class="score-section">
                <div class="score-label">Player</div>
                <div class="score-value" id="playerScore">0</div>
            </div>
            <div class="score-section">
                <div class="score-label">Computer</div>
                <div class="score-value" id="computerScore">0</div>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="400"></canvas>

        <div class="mobile-controls">
            <button class="control-button" id="upButton">⬆️ UP</button>
            <button class="control-button" id="downButton">⬇️ DOWN</button>
        </div>

        <div class="instructions">
            <p><strong>How to Play:</strong></p>
            <ul class="controls-list">
                <li>📱 <strong>Touch</strong> - Move paddle on mobile</li>
                <li>🖱️ <strong>Mouse</strong> - Move left paddle vertically</li>
                <li>⬆️⬇️ <strong>Arrow Keys</strong> - Move left paddle up/down</li>
                <li>🤖 Computer controls the right paddle</li>
            </ul>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game objects
        const paddleWidth = 10;
        const paddleHeight = 80;
        const ballSize = 8;
        const paddleSpeed = 6;

        const difficultySettings = {
            easy: {
                computerSpeed: 2.3,
                trackingDeadZone: 85,
                ballSpeed: 4.6
            },
            medium: {
                computerSpeed: 2.8,
                trackingDeadZone: 60,
                ballSpeed: 5.2
            },
            hard: {
                computerSpeed: 3.6,
                trackingDeadZone: 35,
                ballSpeed: 5.8
            }
        };

        let currentDifficulty = 'medium';

        const player = {
            x: 10,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            dy: 0,
            score: 0,
            speed: paddleSpeed
        };

        const computer = {
            x: canvas.width - paddleWidth - 10,
            y: canvas.height / 2 - paddleHeight / 2,
            width: paddleWidth,
            height: paddleHeight,
            dy: 0,
            score: 0,
            speed: difficultySettings[currentDifficulty].computerSpeed
        };

        const ball = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            dx: difficultySettings[currentDifficulty].ballSpeed,
            dy: difficultySettings[currentDifficulty].ballSpeed,
            size: ballSize,
            speed: difficultySettings[currentDifficulty].ballSpeed
        };

        let keysPressed = {};
        let mouseY = canvas.height / 2;
        let touchY = canvas.height / 2;
        let mobileUpPressed = false;
        let mobileDownPressed = false;
        let isMobileDevice = window.innerWidth <= 768;

        function applyDifficulty(level) {
            currentDifficulty = level;
            const settings = difficultySettings[level];
            computer.speed = settings.computerSpeed;
            ball.speed = settings.ballSpeed;
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * ball.speed;
            ball.dy = (Math.random() * 2 - 1) * ball.speed;

            document.querySelectorAll('.difficulty-btn').forEach((button) => {
                button.classList.toggle('active', button.dataset.difficulty === level);
            });
        }

        document.querySelectorAll('.difficulty-btn').forEach((button) => {
            button.addEventListener('click', () => {
                applyDifficulty(button.dataset.difficulty);
            });
        });

        function checkMobileDevice() {
            isMobileDevice = window.innerWidth <= 768;
        }

        window.addEventListener('resize', checkMobileDevice);

        // Event listeners for keyboard
        window.addEventListener('keydown', (e) => {
            keysPressed[e.key] = true;
        });

        window.addEventListener('keyup', (e) => {
            keysPressed[e.key] = false;
        });

        // Event listeners for mouse
        document.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseY = e.clientY - rect.top;
        });

        // Event listeners for touch
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            touchY = touch.clientY - rect.top;
        }, { passive: false });

        document.addEventListener('touchend', () => {
            touchY = canvas.height / 2;
        });

        const upButton = document.getElementById('upButton');
        const downButton = document.getElementById('downButton');

        if (upButton) {
            upButton.addEventListener('touchstart', (e) => {
                e.preventDefault();
                mobileUpPressed = true;
            });
            upButton.addEventListener('touchend', (e) => {
                e.preventDefault();
                mobileUpPressed = false;
            });
            upButton.addEventListener('mousedown', () => {
                mobileUpPressed = true;
            });
            upButton.addEventListener('mouseup', () => {
                mobileUpPressed = false;
            });
        }

        if (downButton) {
            downButton.addEventListener('touchstart', (e) => {
                e.preventDefault();
                mobileDownPressed = true;
            });
            downButton.addEventListener('touchend', (e) => {
                e.preventDefault();
                mobileDownPressed = false;
            });
            downButton.addEventListener('mousedown', () => {
                mobileDownPressed = true;
            });
            downButton.addEventListener('mouseup', () => {
                mobileDownPressed = false;
            });
        }

        function updatePlayer() {
            if (isMobileDevice && touchY !== canvas.height / 2) {
                if (touchY < player.y + paddleHeight / 2) {
                    player.y -= player.speed;
                } else if (touchY > player.y + paddleHeight / 2) {
                    player.y += player.speed;
                }
            }

            if (mobileUpPressed) player.y -= player.speed;
            if (mobileDownPressed) player.y += player.speed;

            if (!isMobileDevice) {
                if (mouseY < player.y + paddleHeight / 2) {
                    player.y -= player.speed;
                } else if (mouseY > player.y + paddleHeight / 2) {
                    player.y += player.speed;
                }
            }

            if (keysPressed['ArrowUp']) player.y -= player.speed;
            if (keysPressed['ArrowDown']) player.y += player.speed;

            if (player.y < 0) player.y = 0;
            if (player.y + player.height > canvas.height) {
                player.y = canvas.height - player.height;
            }
        }

        function updateComputer() {
            const computerCenter = computer.y + computer.height / 2;
            const ballCenter = ball.y;
            const deadZone = difficultySettings[currentDifficulty].trackingDeadZone;

            if (computerCenter < ballCenter - deadZone) {
                computer.y += computer.speed;
            } else if (computerCenter > ballCenter + deadZone) {
                computer.y -= computer.speed;
            }

            if (computer.y < 0) computer.y = 0;
            if (computer.y + computer.height > canvas.height) {
                computer.y = canvas.height - computer.height;
            }
        }

        function updateBall() {
            ball.x += ball.dx;
            ball.y += ball.dy;

            if (ball.y - ball.size < 0 || ball.y + ball.size > canvas.height) {
                ball.dy = -ball.dy;
                ball.y = Math.max(ball.size, Math.min(canvas.height - ball.size, ball.y));
            }

            if (
                ball.x - ball.size < player.x + player.width &&
                ball.y > player.y &&
                ball.y < player.y + player.height
            ) {
                ball.dx = Math.abs(ball.dx);
                let collidePoint = ball.y - (player.y + player.height / 2);
                collidePoint = collidePoint / (player.height / 2);
                ball.dy = collidePoint * ball.speed;
                ball.x = player.x + player.width + ball.size;
            }

            if (
                ball.x + ball.size > computer.x &&
                ball.y > computer.y &&
                ball.y < computer.y + computer.height
            ) {
                ball.dx = -Math.abs(ball.dx);
                let collidePoint = ball.y - (computer.y + computer.height / 2);
                collidePoint = collidePoint / (computer.height / 2);
                ball.dy = collidePoint * ball.speed;
                ball.x = computer.x - ball.size;
            }

            if (ball.x < 0) {
                computer.score++;
                resetBall();
            }
            if (ball.x > canvas.width) {
                player.score++;
                resetBall();
            }

            updateScore();
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.dx = (Math.random() > 0.5 ? 1 : -1) * ball.speed;
            ball.dy = (Math.random() * 2 - 1) * ball.speed;
        }

        function drawPaddle(paddle) {
            ctx.fillStyle = '#fff';
            ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
        }

        function drawBall() {
            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.size, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawCenterLine() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.setLineDash([10, 10]);
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        function updateScore() {
            document.getElementById('playerScore').textContent = player.score;
            document.getElementById('computerScore').textContent = computer.score;
        }

        function gameLoop() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawCenterLine();
            drawPaddle(player);
            drawPaddle(computer);
            drawBall();

            updatePlayer();
            updateComputer();
            updateBall();

            requestAnimationFrame(gameLoop);
        }

        applyDifficulty(currentDifficulty);
        gameLoop();
    </script>
</body>
</html>
